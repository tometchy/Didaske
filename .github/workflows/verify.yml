name: Verify reader and corpus
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash scripts/setup-visual-tests.sh --with-deps
      - run: python3 -m unittest discover -s tests
      - run: python3 data/build/snapshot.py
      - run: python3 tests/data/check-content-integrity.py
      - run: node --test tests/data/integrity.test.mjs
      - run: npm --prefix app test
      - run: env -u KDJ_VISUAL_BASE_URL bash scripts/test-screenshots.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reader-test-report
          path: |
            screenshots/results/
            screenshots/report/
          retention-days: 7
