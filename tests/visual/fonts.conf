<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Match the system UI typeface used to capture the Linux reader baselines. -->
  <alias binding="strong">
    <family>system-ui</family><prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family><prefer><family>Noto Sans</family></prefer>
  </alias>
  <include>/etc/fonts/fonts.conf</include>
</fontconfig>
